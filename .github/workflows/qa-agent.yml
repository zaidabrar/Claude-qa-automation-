name: qa-agent

# Three ways in:
#  1. Manually: Actions -> qa-agent -> Run workflow -> ticket key.
#  2. From Jira Automation: "Send web request" to
#     POST https://api.github.com/repos/<owner>/<repo>/dispatches
#     body: {"event_type": "qa-ticket", "client_payload": {"ticket": "{{issue.key}}"}}
#  3. On a schedule: sweep the `jira.ready_jql` queue.
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Jira ticket key (leave empty to sweep the ready queue)
        required: false
      mode:
        description: autonomy mode
        type: choice
        options: [autonomous, dry_run]
        default: autonomous
  repository_dispatch:
    types: [qa-ticket]
  schedule:
    - cron: "17 */2 * * 1-5" # every 2h on weekdays

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qa-agent-${{ github.event.inputs.ticket || github.event.client_payload.ticket || 'sweep' }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # PRs opened with the default GITHUB_TOKEN do not trigger other workflows (e.g. ci).
      # Set QA_BOT_TOKEN (a fine-grained PAT or GitHub App token) if you need CI on agent PRs.
      GITHUB_TOKEN: ${{ secrets.QA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      TICKET: ${{ github.event.inputs.ticket || github.event.client_payload.ticket }}
      MODE: ${{ github.event.inputs.mode || 'autonomous' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.QA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mobile-tests/pom.xml
      - run: pip install -e .
      - name: Configure git identity
        run: |
          git config user.name "qa-agent[bot]"
          git config user.email "qa-agent@users.noreply.github.com"
      - name: Config
        run: test -f qa_harness.yaml || cp qa_harness.example.yaml qa_harness.yaml
      - run: qa-harness doctor
        continue-on-error: true
      - name: Run for one ticket
        if: env.TICKET != ''
        run: qa-harness --mode "$MODE" run "$TICKET"
      - name: Sweep ready queue
        if: env.TICKET == ''
        run: qa-harness --mode "$MODE" watch --once
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-runs-${{ github.run_id }}
          path: .qa_runs/
          retention-days: 14
