[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-harness"
version = "0.1.0"
description = "QA toolbox for GitHub Copilot: Jira -> Appium Java/TestNG/Cucumber -> Sauce Labs -> Jira bugs + pull request. No LLM key."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx2>=2.13",
    "mcp>=2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
qa-harness = "qa_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
