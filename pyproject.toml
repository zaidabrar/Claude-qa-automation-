[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-harness"
version = "0.1.0"
description = "Autonomous AI QA harness for mobile apps: Jira ticket -> Appium tests -> Sauce Labs validation -> pull request."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "httpx2>=2.13",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mobile = [
    "Appium-Python-Client>=4.0",
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
qa-harness = "qa_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qa_harness = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
